# 공개 서버(AWS EC2 등) 1대용 운영 구성. 로컬 개발용 ../docker-compose.yml과 달리:
#   - MySQL 포트를 호스트에 열지 않는다 (컨테이너 네트워크 안에서만 접근)
#   - 비밀번호·키를 파일에 적지 않고 전부 환경변수로 받는다 (없으면 기동 자체를 막는다)
#   - 80/443은 Caddy만 연다. 백엔드(8081)는 밖으로 노출하지 않고 Caddy가 HTTPS로 중계한다
#
# 실행 (레포 루트에서):
#   docker compose -f deploy/docker-compose.prod.yml --env-file /opt/mongle/.env up -d --build
# 필요한 변수는 deploy/prod.env.example, 자세한 절차는 docs/DEPLOY.md 참고.
#
# 인스턴스는 반드시 1대다: 대화 컨텍스트(SessionContextStore)와 인증 호출 제한이 서버 메모리에 있다.
name: mongle-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mongle
      MYSQL_USER: mongle
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD를 설정하세요}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 설정하세요}"
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/mongle?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: mongle
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD를 설정하세요}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET을 설정하세요 (openssl rand -base64 48)}"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?프론트 주소를 설정하세요 (https://xxx.netlify.app 형태)}"
      # Caddy 뒤에서 실제 접속자 IP로 인증 호출 제한을 세려면 native여야 한다(framework 금지, application.yml 주석 참고).
      FORWARD_HEADERS_STRATEGY: native
    expose:
      - "8081"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?SITE_ADDRESS를 설정하세요 (api.example.com 형태)}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  mysql-data:
  caddy-data:
