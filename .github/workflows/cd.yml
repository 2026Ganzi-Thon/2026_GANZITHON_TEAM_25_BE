name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  deploy:
    name: 운영 EC2 배포
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    concurrency:
      group: mongle-production-deploy
      cancel-in-progress: false

    steps:
      - name: 테스트한 커밋으로 배포
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_SSH_HOST" || -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_SSH_KNOWN_HOSTS" ]]; then
            echo "DEPLOY_SSH_HOST, DEPLOY_SSH_KEY, DEPLOY_SSH_KNOWN_HOSTS 설정을 확인해 주세요." >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ || ! "$DEPLOY_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo "배포 커밋 또는 SSH 주소 형식이 올바르지 않습니다." >&2
            exit 1
          fi

          umask 077
          sshDirectory="$(mktemp -d)"
          trap 'rm -rf -- "$sshDirectory"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$sshDirectory/identity"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$sshDirectory/known_hosts"

          ssh -F /dev/null -T \
            -i "$sshDirectory/identity" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$sshDirectory/known_hosts" \
            "ubuntu@$DEPLOY_SSH_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          deploySha="$1"
          cd "$HOME/2026_GANZITHON_TEAM_25_BE"

          GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$deploySha" ]]; then
            echo "main에 더 최신 커밋이 있어 이 배포를 건너뜁니다."
            exit 0
          fi
          if [[ "$(git branch --show-current)" != main || -n "$(git status --porcelain)" ]]; then
            echo "운영 저장소의 현재 브랜치와 변경 내용을 확인해 주세요." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "$deploySha"; then
            echo "운영 main을 테스트한 커밋으로 fast-forward할 수 없습니다." >&2
            exit 1
          fi

          git merge --ff-only "$deploySha"
          docker compose -f deploy/docker-compose.prod.yml --env-file /opt/mongle/.env \
            up --build --wait --wait-timeout 120
          printf 'EC2 배포 커밋 %s\n' "$deploySha"
          REMOTE

      - name: 운영 HTTPS 헬스체크
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 8 https://api.mongle.asia/actuator/health \
                | jq --exit-status '.status == "UP"' > /dev/null; then
              echo "운영 백엔드가 UP 상태입니다."
              exit 0
            fi
            if (( attempt < 12 )); then
              sleep 5
            fi
          done
          echo "운영 백엔드의 HTTPS 헬스체크가 통과하지 않았습니다." >&2
          exit 1
