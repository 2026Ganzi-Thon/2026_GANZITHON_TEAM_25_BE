server:
  port: 8081 # Coffeul 등 다른 프로젝트가 로컬에서 8080을 쓰는 경우가 많아 겹치지 않게 분리
  # 리버스 프록시(nginx, 로드밸런서, PaaS 라우터) 뒤에 배포하면 getRemoteAddr()가 프록시 IP로 고정돼서
  # /auth/anonymous의 IP당 호출 제한(AnonymousAuthRateLimiter)이 전 사용자를 한 덩어리로 세어버린다.
  # 프록시 뒤일 때만 FORWARD_HEADERS_STRATEGY=native로 켠다(Tomcat RemoteIpValve: X-Forwarded-For를
  # 오른쪽부터 읽어 신뢰 프록시를 건너뛴다). framework는 맨 왼쪽 값을 써서 nginx 뒤에서도 클라이언트가
  # 헤더를 위조하면 제한을 우회할 수 있다(PR #8 리뷰에서 지적, 2026-11-12 실제 재현으로 확인).
  # 프록시 없이 직접 노출된 서버에서는 어떤 값이든 위조가 가능하므로 기본값은 none.
  # 신뢰 프록시 기본 범위는 사설 IP(10.x·172.16~31.x·192.168.x·127.x 등)다. 프록시가 공인 IP면
  # server.tomcat.remoteip.internal-proxies로 직접 지정해야 한다.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: mongle-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/mongle?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:mongle}
    password: ${DB_PASSWORD:mongle-dev}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리한다 — Hibernate가 임의로 테이블을 고치지 않는다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

mongle:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-days: 365
  auth:
    # /auth/anonymous는 로그인이 없어서 누구나 임의의 UUID를 deviceId로 계속 보내면 app_user
    # row가 무제한 쌓일 수 있다(2026-11-11 보안 점검에서 발견, 결선 "민감정보관리/취약점대응"
    # 항목 대비). 같은 deviceId 재사용은 기존 row를 찾아 재사용하니 막을 필요 없고, IP당 호출
    # 자체를 창(window) 단위로 제한한다. 값은 임의 기준 — 데모 중 여러 기기가 같은 네트워크(IP)를
    # 공유해도 넉넉하게 통과하도록 넓게 잡음, 필요하면 조정.
    anonymous-rate-limit:
      max-per-window: 30
      window-minutes: 10
    # 아이디·비밀번호 가입/로그인 호출 제한(2026-11-15). IP 범위는 같은 와이파이의 여러 기기를 감안해 넉넉하게,
    # 실패 횟수는 아이디당 10번이면 창이 끝날 때까지 로그인을 막는다(무차별 대입 방어). 값은 임의 기준이라 필요하면 조정.
    account-rate-limit:
      signup-ip-per-window: 30
      check-id-ip-per-window: 120
      login-ip-per-window: 60
      login-failure-per-id: 10
      window-minutes: 10
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta
    # 2026-11-09 실측: 실제 키로 5회 호출, 전부 4.7~5.1초. 명세서 원안의 "3초 기준"은 전부
    # 폴백으로 떨어지는 값이라 의미가 없었음 — 8초로 올려서 여유를 둔다.
    timeout-ms: 8000
  reflections:
    # 한 세션에서 받을 수 있는 공감 대화 횟수. 시연 중 길게 대화해도 429로 막히지 않게 20에서 50으로 올림(2026-11-20).
    # 호출 수만큼 Gemini 비용(사비)이 드니, 시연이 끝나면 필요에 따라 되돌린다.
    max-per-session: 50
  risk:
    # 명세서 4.3.1 1차 리스트(초안) — 팀 검수 필요. 쉼표로만 구분, 공백은 trim된다.
    # 2026-11-09: 원래 16개에 흔한 동의어·활용형 8개 보강(목매/번개탄/투신/극단적 선택 — 자살 관련
    # 완곡어·방법 언급, 맞고/쫓아온다/따라온다 — "맞았다"류 과거형만 잡던 걸 진행형·현재형까지 커버,
    # 자해하고 — "자해"는 이미 부분일치로 걸리지만 "자해하고 싶어" 패턴 확인차 명시). 여전히 팀 검수 전
    # 임시 초안이고, 단순 포함 매칭이라 오탐은 감수한다(설계 의도 — 4.3.1 참고).
    # 2026-11-17: 폭력/학대 주제 커버리지 보강(괴롭힘/따돌림/가정폭력/성폭력/성추행/데이트폭력) —
    # 전부 복합어라 오탐 위험이 낮고, 위험 쪽으로만 넓히는 변경이라 팀 승인 없이 추가함.
    keywords: 자살,죽고싶,죽어버리,자해,자해하고,손목,칼로,사라지고싶,목매,번개탄,투신,극단적 선택,때렸,폭행,맞았,맞고,스토킹,미행,쫓아온다,따라온다,찾아올까봐,협박,죽인다,죽일거야,괴롭힘,따돌림,가정폭력,성폭력,성추행,데이트폭력
    # 2026-11-17: 단순 포함 매칭의 알려진 오탐(칼로리→칼로, 그게 맞고 틀리고→맞고, 답 맞았어→맞았)을
    # 줄이기 위한 안전 문구 — matches()가 이 문구들을 먼저 지우고 남은 텍스트에서 키워드를 찾는다.
    # Gemini가 응답하면 이 리스트는 전혀 안 쓰인다(Gemini 실패 시 안전망에만 영향).
    # 주의: 공백을 지우고 비교하므로 "다 맞았"처럼 피해 문장("아빠한테 다 맞았어")에도 붙는 범용
    # 표현은 넣지 않는다 — 오탐 한 건 줄이려다 실제 위기를 놓치는 쪽이 훨씬 비싸다(PR #40 리뷰).
    safe-phrases: 칼로리,그게 맞고,맞고 틀리고,답 맞았,정답 맞았,퀴즈 맞았
  memory:
    soft-limit: 30
    preview-ttl-minutes: 30
  session:
    expire-after-hours: 24

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mongle.backend: INFO
