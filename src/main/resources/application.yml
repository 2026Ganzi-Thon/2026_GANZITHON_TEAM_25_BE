server:
  port: 8081 # Coffeul 등 다른 프로젝트가 로컬에서 8080을 쓰는 경우가 많아 겹치지 않게 분리
  # 리버스 프록시(nginx, 로드밸런서, PaaS 라우터) 뒤에 배포하면 getRemoteAddr()가 프록시 IP로 고정돼서
  # /auth/anonymous의 IP당 호출 제한(AnonymousAuthRateLimiter)이 전 사용자를 한 덩어리로 세어버린다.
  # 프록시 뒤일 때만 FORWARD_HEADERS_STRATEGY=native로 켠다(Tomcat RemoteIpValve: X-Forwarded-For를
  # 오른쪽부터 읽어 신뢰 프록시를 건너뛴다). framework는 맨 왼쪽 값을 써서 nginx 뒤에서도 클라이언트가
  # 헤더를 위조하면 제한을 우회할 수 있다(PR #8 리뷰에서 지적, 2026-11-12 실제 재현으로 확인).
  # 프록시 없이 직접 노출된 서버에서는 어떤 값이든 위조가 가능하므로 기본값은 none.
  # 신뢰 프록시 기본 범위는 사설 IP(10.x·172.16~31.x·192.168.x·127.x 등)다. 프록시가 공인 IP면
  # server.tomcat.remoteip.internal-proxies로 직접 지정해야 한다.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: mongle-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/mongle?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:mongle}
    password: ${DB_PASSWORD:mongle-dev}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리한다 — Hibernate가 임의로 테이블을 고치지 않는다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

mongle:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-days: 365
  auth:
    # /auth/anonymous는 로그인이 없어서 누구나 임의의 UUID를 deviceId로 계속 보내면 app_user
    # row가 무제한 쌓일 수 있다(2026-11-11 보안 점검에서 발견, 결선 "민감정보관리/취약점대응"
    # 항목 대비). 같은 deviceId 재사용은 기존 row를 찾아 재사용하니 막을 필요 없고, IP당 호출
    # 자체를 창(window) 단위로 제한한다. 값은 임의 기준 — 데모 중 여러 기기가 같은 네트워크(IP)를
    # 공유해도 넉넉하게 통과하도록 넓게 잡음, 필요하면 조정.
    anonymous-rate-limit:
      max-per-window: 30
      window-minutes: 10
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta
    # 2026-11-09 실측: 실제 키로 5회 호출, 전부 4.7~5.1초. 명세서 원안의 "3초 기준"은 전부
    # 폴백으로 떨어지는 값이라 의미가 없었음 — 8초로 올려서 여유를 둔다.
    timeout-ms: 8000
  reflections:
    max-per-session: 20
  weather:
    # 현실 날씨 배경(GET /weather). 위치는 서버 고정(기본 서울) — 사용자 좌표를 받지 않는다.
    # Open-Meteo 무료 API는 비상업 용도 전용이고 키가 필요 없다(README 참고). 배포 후 상업 목적이면 유료 플랜 필요.
    base-url: https://api.open-meteo.com/v1
    latitude: 37.5665
    longitude: 126.9780
    timezone: Asia/Seoul
    timeout-ms: 3000
    cache-minutes: 10
  risk:
    # 명세서 4.3.1 1차 리스트(초안) — 팀 검수 필요. 쉼표로만 구분, 공백은 trim된다.
    # 2026-11-09: 원래 16개에 흔한 동의어·활용형 8개 보강(목매/번개탄/투신/극단적 선택 — 자살 관련
    # 완곡어·방법 언급, 맞고/쫓아온다/따라온다 — "맞았다"류 과거형만 잡던 걸 진행형·현재형까지 커버,
    # 자해하고 — "자해"는 이미 부분일치로 걸리지만 "자해하고 싶어" 패턴 확인차 명시). 여전히 팀 검수 전
    # 임시 초안이고, 단순 포함 매칭이라 오탐은 감수한다(설계 의도 — 4.3.1 참고).
    keywords: 자살,죽고싶,죽어버리,자해,자해하고,손목,칼로,사라지고싶,목매,번개탄,투신,극단적 선택,때렸,폭행,맞았,맞고,스토킹,미행,쫓아온다,따라온다,찾아올까봐,협박,죽인다,죽일거야
  memory:
    soft-limit: 30
    preview-ttl-minutes: 30
  session:
    expire-after-hours: 24

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mongle.backend: INFO
